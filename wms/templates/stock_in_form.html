{% extends "base.html" %}
{% block title %}{{ '编辑' if order else '新建' }}入库单{% endblock %}
{% block content %}
<h4 class="mb-3">{{ '编辑' if order else '新建' }}入库单{% if order %}（{{ order.code }}）{% endif %}</h4>

<form method="post"
      action="{{ url_for('stock_in.edit', oid=order.id) if order else url_for('stock_in.create') }}"
      onsubmit="return validateItems()">
  <div class="card mb-3">
    <div class="card-body row g-3">
      <div class="col-md-3">
        <label class="form-label">入库仓库 <span class="text-danger">*</span></label>
        <select name="warehouse_id" class="form-select" required>
          <option value="">请选择</option>
          {% for w in warehouses %}
          <option value="{{ w.id }}" {{ 'selected' if order and order.warehouse_id == w.id }}>{{ w.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">供应商</label>
        <select name="supplier_id" class="form-select">
          <option value="">无</option>
          {% for s in suppliers %}
          <option value="{{ s.id }}" {{ 'selected' if order and order.supplier_id == s.id }}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">备注</label>
        <input type="text" name="remark" class="form-control" value="{{ order.remark if order else '' }}">
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>商品明细</span>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRow()">添加商品</button>
    </div>
    <div class="table-responsive">
      <table class="table align-middle mb-0" id="itemsTable">
        <thead class="table-light">
          <tr>
            <th style="width:38%">商品</th>
            <th style="width:14%">数量</th>
            <th style="width:14%">单价</th>
            <th class="text-end" style="width:14%">小计</th>
            <th style="width:8%">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr>
            <td colspan="3" class="text-end fw-bold">合计</td>
            <td class="text-end fw-bold" id="grandTotal">¥0.00</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="mb-4">
    <button type="submit" class="btn btn-primary">保存</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('stock_in.index') }}">取消</a>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
const PRODUCTS = {{ products | tojson }};
const PREFILL = {{ items | tojson }};

function productOptions(selectedId) {
  let html = '<option value="">请选择商品</option>';
  for (const p of PRODUCTS) {
    const sel = p.id === selectedId ? 'selected' : '';
    html += `<option value="${p.id}" data-price="${p.price}" ${sel}>${p.sku} ${p.name}（${p.spec} / ${p.unit}）</option>`;
  }
  return html;
}

function addRow(item) {
  item = item || {product_id: '', quantity: '', unit_price: ''};
  const tbody = document.querySelector('#itemsTable tbody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><select name="product_id" class="form-select form-select-sm" required onchange="onProductChange(this)">${productOptions(item.product_id)}</select></td>
    <td><input type="number" name="quantity" class="form-control form-control-sm" min="1" step="1" value="${item.quantity}" required oninput="recalc()"></td>
    <td><input type="number" name="unit_price" class="form-control form-control-sm" min="0" step="0.01" value="${item.unit_price}" required oninput="recalc()"></td>
    <td class="text-end subtotal">¥0.00</td>
    <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">删除</button></td>`;
  tbody.appendChild(tr);
  recalc();
}

function onProductChange(sel) {
  const price = parseFloat(sel.selectedOptions[0].dataset.price || 0);
  const tr = sel.closest('tr');
  const priceInput = tr.querySelector('input[name="unit_price"]');
  if (!priceInput.value) priceInput.value = price.toFixed(2);
  recalc();
}

function removeRow(btn) {
  btn.closest('tr').remove();
  recalc();
}

function recalc() {
  let total = 0;
  document.querySelectorAll('#itemsTable tbody tr').forEach(tr => {
    const qty = parseFloat(tr.querySelector('input[name="quantity"]').value) || 0;
    const price = parseFloat(tr.querySelector('input[name="unit_price"]').value) || 0;
    const sub = qty * price;
    tr.querySelector('.subtotal').textContent = '¥' + sub.toFixed(2);
    total += sub;
  });
  document.getElementById('grandTotal').textContent = '¥' + total.toFixed(2);
}

function validateItems() {
  const rows = document.querySelectorAll('#itemsTable tbody tr');
  if (!rows.length) {
    alert('请至少添加一行商品明细');
    return false;
  }
  return true;
}

if (PREFILL.length) {
  PREFILL.forEach(addRow);
} else {
  addRow();
}
</script>
{% endblock %}
